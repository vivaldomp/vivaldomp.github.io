    </text>
    <text y="252" font-size="22" fill="#94a3b8">
      20+ years building internal platforms · MCP · Spec-Driven Development · AWS · Kubernetes
    </text>

    <g transform="translate(0, 320)" font-family="ui-monospace, JetBrains Mono, monospace" font-size="20" fill="#94a3b8">
      <text y="0">github.com/vivaldomp</text>
      <text y="34">linkedin.com/in/vivaldomp</text>
    </g>
