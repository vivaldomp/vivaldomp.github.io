name: SDLC 01 - Refine PRD (Pi + OpenCode Go)
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: prd-refine-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  refine:
    if: >-
      github.event.issue.user.login == 'vivaldomp' &&
      github.event.label.name == 'prd'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install Pi + pi-lens
        run: bash scripts/sdlc/setup-pi.sh
      - name: Fetch PRD issue context (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p .sdlc-work
          gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,state > .sdlc-work/issue.json
      - name: Run product analyst (no GitHub token, no write tools)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SDLC_MODEL: ${{ vars.SDLC_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
        run: |
          test -n "$OPENCODE_API_KEY" || { echo 'Missing OPENCODE_API_KEY'; exit 1; }
          pi --model "$SDLC_MODEL" --no-session --tools read,grep,find,ls,lens_diagnostics --print \
            @.github/agents/prd-analyst.md @.sdlc-work/issue.json \
            'Refine this issue, following the agent playbook. Output Markdown only.' \
            > .sdlc-work/refinement.md
          test -s .sdlc-work/refinement.md
      - name: Publish plan for human approval
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file .sdlc-work/refinement.md
      - name: Retain plan as evidence
        uses: actions/upload-artifact@v4
        with:
          name: prd-${{ github.event.issue.number }}-plan
          path: .sdlc-work/refinement.md
          retention-days: 14
